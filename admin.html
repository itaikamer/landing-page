<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>פניות · נתנאל סבן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --pearl:#ebe8ef; --pearl-2:#e0dce8; --pearl-3:#d6d1e0; --ink:#0f0e13; --soft:#6b6676;
  --pink:#f2a7e6; --violet:#a99cff; --gold:#c9a35c; --card:#f6f4f8;
  --display:"Karantina", "Heebo", sans-serif; --text:"Heebo", system-ui, sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0}
body{background:var(--pearl);color:var(--ink);font-family:var(--text);font-weight:300;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:clamp(28px,6vw,64px) 16px 80px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-size:13px;letter-spacing:.2em;color:var(--gold);font-weight:500}
h1{font-family:var(--display);font-weight:700;font-size:clamp(64px,12vw,120px);line-height:.85;margin-top:6px}
.refresh{font:inherit;font-size:14px;background:none;border:1px solid var(--pearl-3);color:var(--ink);padding:10px 18px;border-radius:999px;cursor:pointer;transition:background .2s,transform .15s var(--ease)}
.refresh:hover{background:var(--pearl-2)} .refresh:active{transform:scale(.96)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:36px 0 20px}
.stat{background:var(--card);border-radius:18px;padding:18px 20px}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:48px;line-height:1}
.stat span{font-size:13px;color:var(--soft)}

.search{width:100%;font:inherit;font-size:16px;background:var(--card);border:1px solid transparent;border-radius:14px;padding:14px 18px;color:var(--ink);outline:none;transition:border-color .2s}
.search:focus{border-color:var(--violet)}
.search::placeholder{color:var(--soft)}

.list{display:grid;gap:12px;margin-top:20px}
.lead{background:var(--card);border-radius:20px;padding:20px 22px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;animation:in .5s var(--ease) both}
.lead.new{box-shadow:inset -3px 0 0 var(--pink)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.name{font-size:20px;font-weight:500}
.when{font-size:13px;color:var(--soft);white-space:nowrap}
.contact{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px;color:var(--soft)}
.contact span{direction:ltr;unicode-bidi:isolate}
.actions{grid-column:1/-1;display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions a{font-size:14px;text-decoration:none;color:var(--ink);background:var(--pearl);padding:8px 14px;border-radius:999px;transition:background .2s,transform .15s var(--ease)}
.actions a:hover{background:var(--pearl-3)} .actions a:active{transform:scale(.96)}
.actions a.wa{background:#dff3e4} .actions a.wa:hover{background:#c9ebd2}

.empty{text-align:center;color:var(--soft);padding:60px 20px;font-size:16px;line-height:1.7}
.empty b{display:block;font-family:var(--display);font-size:44px;font-weight:700;color:var(--ink);margin-bottom:6px}
.setup{background:var(--card);border-radius:20px;padding:24px 26px;margin-top:36px;line-height:1.8}
.setup h2{font-size:18px;font-weight:500;margin-bottom:8px}
.setup ol{padding-inline-start:20px}
.setup code{background:var(--pearl);padding:2px 8px;border-radius:6px;direction:ltr;unicode-bidi:isolate;font-size:14px}

@media (max-width:560px){
  .stats{grid-template-columns:1fr 1fr} .stat:first-child{grid-column:1/-1}
  .lead{grid-template-columns:1fr} .when{order:-1}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">NSN · נתנאל סבן</div>
      <h1>פניות</h1>
    </div>
    <button class="refresh" id="refresh">רענון</button>
  </header>
  <main id="main"></main>
</div>

<script>
const main = document.getElementById('main');
const rtf = new Intl.RelativeTimeFormat('he', { numeric: 'auto' });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let leads = [];

// "לפני שעתיים", "אתמול", ואחרי שבוע תאריך מלא
function when(iso) {
  const d = new Date(iso), sec = (d - Date.now()) / 1000;
  if (sec > -60) return 'עכשיו';
  if (sec > -3600) return rtf.format(Math.round(sec / 60), 'minute');
  if (sec > -86400) return rtf.format(Math.round(sec / 3600), 'hour');
  if (sec > -604800) return rtf.format(Math.round(sec / 86400), 'day');
  return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });
}

// 050-1234567 → 972501234567 לקישור וואטסאפ
function waNumber(phone) {
  const digits = phone.replace(/\D/g, '');
  return digits.startsWith('0') ? '972' + digits.slice(1) : digits;
}

function render(filter = '') {
  const q = filter.trim().toLowerCase();
  const shown = q ? leads.filter(l => [l.name, l.phone, l.email].some(v => v.toLowerCase().includes(q) || v.replace(/\D/g, '').includes(q.replace(/\D/g, '') || '\u0000'))) : leads;
  const today = new Date().toDateString();
  const week = Date.now() - 7 * 86400000;
  const isToday = l => new Date(l.created_at).toDateString() === today;

  main.innerHTML = `
    <section class="stats">
      <div class="stat"><b>${leads.length}</b><span>פניות בסך הכל</span></div>
      <div class="stat"><b>${leads.filter(isToday).length}</b><span>היום</span></div>
      <div class="stat"><b>${leads.filter(l => new Date(l.created_at) >= week).length}</b><span>בשבוע האחרון</span></div>
    </section>
    <input class="search" id="search" type="search" placeholder="חיפוש לפי שם, טלפון או אימייל" value="${esc(filter)}">
    <section class="list">
      ${shown.length ? shown.map((l, i) => `
        <article class="lead${isToday(l) ? ' new' : ''}" style="animation-delay:${Math.min(i, 10) * 40}ms">
          <div class="name">${esc(l.name)}</div>
          <div class="when" title="${esc(new Date(l.created_at).toLocaleString('he-IL'))}">${when(l.created_at)}</div>
          <div class="contact"><span>${esc(l.phone)}</span><span>${esc(l.email)}</span></div>
          <div class="actions">
            <a href="tel:${esc(l.phone.replace(/[^\d+]/g, ''))}">להתקשר</a>
            <a class="wa" href="https://wa.me/${waNumber(l.phone)}" target="_blank" rel="noopener">וואטסאפ</a>
            <a href="mailto:${esc(l.email)}">מייל</a>
          </div>
        </article>`).join('') : `
        <div class="empty">${leads.length ? '<b>לא נמצא</b>אין פנייה שמתאימה לחיפוש.' : '<b>עדיין אין פניות</b>כשמישהו ישאיר פרטים באתר, הוא יופיע כאן.'}</div>`}
    </section>`;

  const search = document.getElementById('search');
  search.addEventListener('input', e => { const pos = e.target.selectionStart; render(e.target.value); const s = document.getElementById('search'); s.focus(); s.setSelectionRange(pos, pos); });
}

function showSetup() {
  main.innerHTML = `
    <div class="setup">
      <h2>חסר שלב אחד: המפתח הסודי של Supabase</h2>
      <ol>
        <li>נכנסים ל-Supabase, לפרויקט "landing page test".</li>
        <li>בתפריט: <b>Project Settings</b> ← <b>API Keys</b>.</li>
        <li>תחת <b>Secret keys</b> לוחצים על סימן ההעתקה ליד המפתח (מתחיל ב-<code>sb_secret_</code>).</li>
        <li>פותחים את הקובץ <code>.env</code> בתיקיית האתר ומוסיפים שורה: <code>SUPABASE_SECRET_KEY=</code> ואחריה מדביקים את המפתח.</li>
        <li>מפעילים מחדש את השרת ומרעננים את הדף.</li>
      </ol>
    </div>`;
}

async function load() {
  try {
    const r = await fetch('/api/leads');
    const data = await r.json();
    if (data.error === 'missing-secret') return showSetup();
    if (!r.ok) throw new Error(data.error);
    leads = data.leads;
    render(document.getElementById('search')?.value || '');
  } catch (err) {
    main.innerHTML = `<div class="empty"><b>משהו השתבש</b>${esc(err.message || 'לא הצלחנו לטעון את הפניות.')}</div>`;
  }
}

document.getElementById('refresh').addEventListener('click', load);
load();
</script>
</body>
</html>
