<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>פניות · נתנאל סבן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --pearl:#ebe8ef; --pearl-2:#e0dce8; --pearl-3:#d6d1e0; --ink:#0f0e13; --soft:#6b6676;
  --pink:#f2a7e6; --violet:#a99cff; --gold:#c9a35c; --card:#f6f4f8;
  --ok:#2f8a55; --okbg:#dff3e4; --late:#b4462f; --latebg:#f8e1db;
  --display:"Karantina", "Heebo", sans-serif; --text:"Heebo", system-ui, sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0}
body{background:var(--pearl);color:var(--ink);font-family:var(--text);font-weight:300;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:clamp(28px,5vw,56px) 16px 80px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-size:13px;letter-spacing:.2em;color:var(--gold);font-weight:500}
h1{font-family:var(--display);font-weight:700;font-size:clamp(64px,12vw,120px);line-height:.85;margin-top:6px}
.refresh{font-size:14px;background:none;border:1px solid var(--pearl-3);padding:10px 18px;border-radius:999px;transition:background .2s,transform .15s var(--ease)}
.refresh:hover{background:var(--pearl-2)} .refresh:active{transform:scale(.96)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:32px 0 18px}
.stat{background:var(--card);border-radius:18px;padding:16px 20px}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--soft)}
.stat.alert b{color:var(--late)}

.search{width:100%;font-size:16px;background:var(--card);border:1px solid transparent;border-radius:14px;padding:14px 18px;outline:none;transition:border-color .2s}
.search:focus{border-color:var(--violet)}
.search::placeholder{color:var(--soft)}

/* ---- board ---- */
.board-wrap{overflow-x:auto;margin-top:18px;padding-bottom:8px;scroll-snap-type:x mandatory}
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;min-width:1200px}
.col{background:var(--pearl-2);border-radius:18px;padding:12px;display:grid;gap:10px;align-content:start;min-height:240px;scroll-snap-align:start}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px;font-weight:500}
.col-h span{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.col[data-s="won"] .col-h{color:var(--ok)}
.col[data-s="lost"]{opacity:.75}
.col-empty{font-size:13px;color:var(--soft);padding:8px 4px}

.card{background:var(--card);border:1px solid transparent;border-radius:14px;padding:12px 14px;display:grid;gap:6px;text-align:right;width:100%;transition:border-color .2s,transform .15s var(--ease);animation:in .4s var(--ease) both}
.card:hover{border-color:var(--pearl-3)}
.card:active{transform:scale(.98)}
.card.fresh{box-shadow:inset -3px 0 0 var(--pink)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .name{font-size:17px;font-weight:500;overflow-wrap:anywhere}
.card .when{font-size:12px;color:var(--soft);white-space:nowrap}
.card .phone{font-size:14px;color:var(--soft);direction:ltr;unicode-bidi:isolate;justify-self:end}
.card .note{font-size:13px;line-height:1.5;border-right:2px solid var(--violet);padding-right:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{justify-self:start;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--pearl);color:var(--soft)}
.chip.today{background:var(--okbg);color:var(--ok);font-weight:500}
.chip.late{background:var(--latebg);color:var(--late);font-weight:500}

/* ---- editor sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(15,14,19,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;bottom:0;left:0;width:min(440px,100%);background:var(--card);box-shadow:0 0 40px rgba(15,14,19,.15);transform:translateX(-102%);transition:transform .35s var(--ease);overflow-y:auto;padding:28px 24px 40px;display:grid;gap:20px;align-content:start}
.sheet.open{transform:none}
.sheet h2{font-family:var(--display);font-weight:700;font-size:52px;line-height:.9;overflow-wrap:anywhere}
.sheet .x{position:absolute;top:16px;left:16px;background:var(--pearl);border:0;width:36px;height:36px;border-radius:50%;font-size:18px}
.sheet .meta{font-size:14px;color:var(--soft);display:grid;gap:2px}
.sheet .meta span{direction:ltr;unicode-bidi:isolate;text-align:right}
.lbl{font-size:13px;color:var(--soft);font-weight:500;letter-spacing:.04em}
.field{display:grid;gap:8px}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stages button{border:1px solid var(--pearl-3);background:none;border-radius:999px;padding:7px 14px;font-size:14px;transition:background .2s,border-color .2s}
.stages button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
textarea{width:100%;min-height:110px;resize:vertical;background:var(--pearl);border:1px solid transparent;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;outline:none}
textarea:focus{border-color:var(--violet)}
.dates{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dates input{background:var(--pearl);border:1px solid transparent;border-radius:10px;padding:7px 10px;font-size:14px}
.dates button{border:0;background:var(--pearl);border-radius:999px;padding:7px 12px;font-size:13px}
.dates button:hover{background:var(--pearl-3)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions a{font-size:14px;text-decoration:none;color:var(--ink);background:var(--pearl);padding:8px 14px;border-radius:999px;transition:background .2s}
.actions a:hover{background:var(--pearl-3)}
.actions a.wa{background:var(--okbg)}
.save{background:var(--ink);color:var(--card);border:0;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:500;justify-self:start;transition:transform .15s var(--ease),opacity .2s}
.save:active{transform:scale(.96)} .save:disabled{opacity:.5;cursor:default}
.msg{font-size:14px;min-height:1.4em}
.msg.err{color:var(--late)} .msg.ok{color:var(--ok)}

.empty{text-align:center;color:var(--soft);padding:60px 20px;font-size:16px;line-height:1.7}
.empty b{display:block;font-family:var(--display);font-size:44px;font-weight:700;color:var(--ink);margin-bottom:6px}
.setup{background:var(--card);border-radius:20px;padding:24px 26px;margin-top:36px;line-height:1.8;max-width:640px}
.setup h2{font-size:18px;font-weight:500;margin-bottom:8px}
.setup ol{padding-inline-start:20px}
.setup code{background:var(--pearl);padding:2px 8px;border-radius:6px;direction:ltr;unicode-bidi:isolate;font-size:14px}

@media (max-width:640px){
  .stats{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:repeat(5,82vw);min-width:0}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">NSN · נתנאל סבן</div>
      <h1>פניות</h1>
    </div>
    <button class="refresh" id="refresh">רענון</button>
  </header>
  <main id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-hidden="true" aria-labelledby="ed-name"></aside>

<script>
const main = document.getElementById('main');
const sheet = document.getElementById('sheet');
const scrim = document.getElementById('scrim');
const rtf = new Intl.RelativeTimeFormat('he', { numeric: 'auto' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STAGES = [
  { s: 'new', t: 'חדש' },
  { s: 'contacted', t: 'נוצר קשר' },
  { s: 'meeting', t: 'נקבעה פגישה' },
  { s: 'won', t: 'קנה' },
  { s: 'lost', t: 'לא רלוונטי' },
];
const OPEN = ['new', 'contacted', 'meeting'];
let leads = [];
let filter = '';
let editing = null;

// "לפני שעתיים", "אתמול", ואחרי שבוע תאריך מלא
function when(iso) {
  const d = new Date(iso), sec = (d - Date.now()) / 1000;
  if (sec > -60) return 'עכשיו';
  if (sec > -90) return 'לפני דקה';
  if (sec > -3600) return rtf.format(Math.round(sec / 60), 'minute');
  if (sec > -5400) return 'לפני שעה';
  if (sec > -86400) return rtf.format(Math.round(sec / 3600), 'hour');
  if (sec > -604800) return rtf.format(Math.round(sec / 86400), 'day');
  return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });
}

// תאריך מקומי בפורמט 2026-11-11
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayStr = () => ymd(new Date());
const plusDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };

// מתי לחזור: "לחזור היום", "באיחור 3 ימים", "לחזור מחר", או תאריך
function followChip(l) {
  if (!l.follow_up || !OPEN.includes(l.status)) return '';
  const diff = Math.round((new Date(l.follow_up + 'T00:00') - new Date(todayStr() + 'T00:00')) / 86400000);
  if (diff < 0) return `<span class="chip late">באיחור ${-diff === 1 ? 'יום' : -diff + ' ימים'}</span>`;
  if (diff === 0) return '<span class="chip today">לחזור היום</span>';
  if (diff === 1) return '<span class="chip">לחזור מחר</span>';
  return `<span class="chip">לחזור ב-${new Date(l.follow_up + 'T00:00').toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' })}</span>`;
}
const isDue = l => OPEN.includes(l.status) && l.follow_up && l.follow_up <= todayStr();

// 050-1234567 → 972501234567 לקישור וואטסאפ
function waNumber(phone) {
  const digits = phone.replace(/\D/g, '');
  return digits.startsWith('0') ? '972' + digits.slice(1) : digits;
}

function matches(l) {
  const q = filter.trim().toLowerCase();
  if (!q) return true;
  const digits = q.replace(/\D/g, '');
  return [l.name, l.phone, l.email, l.notes || ''].some(v => v.toLowerCase().includes(q) || (digits && v.replace(/\D/g, '').includes(digits)));
}

function render() {
  const today = new Date().toDateString();
  const shown = leads.filter(matches);
  main.innerHTML = `
    <section class="stats">
      <div class="stat"><b>${leads.length}</b><span>פניות בסך הכל</span></div>
      <div class="stat"><b>${leads.filter(l => l.status === 'new').length}</b><span>חדשות, עוד לא דיברו איתן</span></div>
      <div class="stat${leads.some(isDue) ? ' alert' : ''}"><b>${leads.filter(isDue).length}</b><span>לחזור היום</span></div>
      <div class="stat"><b>${leads.filter(l => l.status === 'won').length}</b><span>קנו</span></div>
    </section>
    <input class="search" id="search" type="search" placeholder="חיפוש לפי שם, טלפון, אימייל או הערה" value="${esc(filter)}">
    ${leads.length ? `
    <div class="board-wrap"><div class="board">
      ${STAGES.map(st => {
        const items = shown.filter(l => l.status === st.s)
          .sort((a, b) => (isDue(b) - isDue(a)) || (b.created_at > a.created_at ? 1 : -1));
        return `<section class="col" data-s="${st.s}">
          <div class="col-h">${st.t}<span>${items.length}</span></div>
          ${items.length ? items.map(l => `
            <button class="card${new Date(l.created_at).toDateString() === today ? ' fresh' : ''}" data-id="${l.id}">
              <span class="top"><span class="name">${esc(l.name)}</span><span class="when">${when(l.created_at)}</span></span>
              <span class="phone">${esc(l.phone)}</span>
              ${l.notes ? `<span class="note">${esc(l.notes)}</span>` : ''}
              ${followChip(l)}
            </button>`).join('') : `<div class="col-empty">${filter ? 'אין תוצאות כאן' : 'אין כרגע'}</div>`}
        </section>`;
      }).join('')}
    </div></div>` : '<div class="empty"><b>עדיין אין פניות</b>כשמישהו ישאיר פרטים באתר, הוא יופיע כאן בעמודה "חדש".</div>'}`;

  document.getElementById('search').addEventListener('input', e => {
    const pos = e.target.selectionStart;
    filter = e.target.value;
    render();
    const s = document.getElementById('search'); s.focus(); s.setSelectionRange(pos, pos);
  });
}

main.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) openEditor(+card.dataset.id);
});

// ---- חלון העריכה של פנייה ----
function openEditor(id) {
  const l = leads.find(x => x.id === id);
  if (!l) return;
  editing = { id, status: l.status, notes: l.notes || '', follow_up: l.follow_up || '' };
  sheet.innerHTML = `
    <button class="x" id="ed-close" aria-label="סגירה">✕</button>
    <div>
      <h2 id="ed-name">${esc(l.name)}</h2>
      <div class="meta">
        <span>${esc(l.phone)}</span><span>${esc(l.email)}</span>
        <em style="font-style:normal">השאיר/ה פרטים ${when(l.created_at)}</em>
      </div>
    </div>
    <div class="actions">
      <a href="tel:${esc(l.phone.replace(/[^\d+]/g, ''))}">להתקשר</a>
      <a class="wa" href="https://wa.me/${waNumber(l.phone)}" target="_blank" rel="noopener">וואטסאפ</a>
      <a href="mailto:${esc(l.email)}">מייל</a>
    </div>
    <div class="field">
      <span class="lbl">שלב</span>
      <div class="stages" id="ed-stages">
        ${STAGES.map(st => `<button data-s="${st.s}" aria-pressed="${st.s === l.status}">${st.t}</button>`).join('')}
      </div>
    </div>
    <div class="field">
      <label class="lbl" for="ed-notes">הערות</label>
      <textarea id="ed-notes" placeholder="מה סוכם? למשל: רוצה טבעת אירוסין, תקציב 8,000, יבוא לחנות ביום שלישי">${esc(l.notes || '')}</textarea>
    </div>
    <div class="field">
      <label class="lbl" for="ed-date">מתי לחזור אליו</label>
      <div class="dates">
        <input type="date" id="ed-date" value="${esc(l.follow_up || '')}">
        <button data-d="1">מחר</button><button data-d="3">בעוד 3 ימים</button><button data-d="7">בעוד שבוע</button><button data-d="">בלי תאריך</button>
      </div>
    </div>
    <button class="save" id="ed-save">שמירה</button>
    <div class="msg" id="ed-msg" role="status"></div>`;
  sheet.classList.add('open'); scrim.classList.add('open');
  sheet.setAttribute('aria-hidden', 'false');
  document.getElementById('ed-close').focus();
}

function closeEditor() {
  sheet.classList.remove('open'); scrim.classList.remove('open');
  sheet.setAttribute('aria-hidden', 'true');
  editing = null;
}

sheet.addEventListener('click', e => {
  if (e.target.id === 'ed-close') return closeEditor();
  const st = e.target.closest('#ed-stages button');
  if (st) {
    editing.status = st.dataset.s;
    sheet.querySelectorAll('#ed-stages button').forEach(b => b.setAttribute('aria-pressed', b === st));
    return;
  }
  const d = e.target.closest('.dates button');
  if (d) { document.getElementById('ed-date').value = d.dataset.d === '' ? '' : plusDays(+d.dataset.d); return; }
  if (e.target.id === 'ed-save') save();
});
scrim.addEventListener('click', closeEditor);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && editing) closeEditor(); });

async function save() {
  const btn = document.getElementById('ed-save');
  const msg = document.getElementById('ed-msg');
  const body = {
    id: editing.id,
    status: editing.status,
    notes: document.getElementById('ed-notes').value,
    follow_up: document.getElementById('ed-date').value || null,
  };
  btn.disabled = true; msg.className = 'msg'; msg.textContent = 'שומר...';
  try {
    const r = await fetch('/api/leads', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': encodeURIComponent(password) },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (r.status === 401) { closeEditor(); return forgetPassword(); }
    if (!r.ok) throw new Error(data.error);
    leads = leads.map(l => l.id === data.lead.id ? data.lead : l);
    render();
    closeEditor();
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = err.message || 'לא הצלחנו לשמור. נסו שוב.';
    btn.disabled = false;
  }
}

// ---- כניסה וטעינה ----
function showSetup() {
  main.innerHTML = `
    <div class="setup">
      <h2>חסר שלב אחד: המפתח הסודי של Supabase</h2>
      <ol>
        <li>נכנסים ל-Supabase, לפרויקט "landing page test".</li>
        <li>בתפריט: <b>Project Settings</b> ← <b>API Keys</b>.</li>
        <li>תחת <b>Secret keys</b> לוחצים על סימן ההעתקה ליד המפתח (מתחיל ב-<code>sb_secret_</code>).</li>
        <li>פותחים את הקובץ <code>.env</code> בתיקיית האתר ומוסיפים שורה: <code>SUPABASE_SECRET_KEY=</code> ואחריה מדביקים את המפתח.</li>
        <li>מפעילים מחדש את השרת ומרעננים את הדף.</li>
      </ol>
    </div>`;
}

let password = '';
try { password = sessionStorage.getItem('adminPass') || ''; } catch {}

function forgetPassword() {
  password = '';
  try { sessionStorage.removeItem('adminPass'); } catch {}
  showLogin(true);
}

function showLogin(wrong) {
  main.innerHTML = `
    <form class="setup" id="login">
      <h2>כניסה לדף הפניות</h2>
      ${wrong ? '<p>הסיסמה לא נכונה. נסו שוב.</p>' : ''}
      <input class="search" id="pass" type="password" placeholder="סיסמה" autocomplete="current-password" required>
      <button class="refresh" style="margin-top:12px">כניסה</button>
    </form>`;
  document.getElementById('pass').focus();
  document.getElementById('login').addEventListener('submit', e => {
    e.preventDefault();
    password = document.getElementById('pass').value;
    try { sessionStorage.setItem('adminPass', password); } catch {}
    load();
  });
}

async function load() {
  if (!password) return showLogin(false);
  try {
    const r = await fetch('/api/leads', { headers: { 'x-admin-password': encodeURIComponent(password) } });
    const data = await r.json();
    if (r.status === 401) return forgetPassword();
    if (data.error === 'missing-secret') return showSetup();
    if (!r.ok) throw new Error(data.error);
    leads = data.leads;
    render();
  } catch (err) {
    main.innerHTML = `<div class="empty"><b>משהו השתבש</b>${esc(err.message || 'לא הצלחנו לטעון את הפניות.')}</div>`;
  }
}

document.getElementById('refresh').addEventListener('click', load);
load();
</script>
</body>
</html>
